```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Modern Registration Page</title>

    <style>

        /* ===== GENERAL ===== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #e9b7ee;
            color: #222;
        }


        /* ===== NAVBAR ===== */

        nav {
            background: #111827;
            color: white;

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 20px 8%;
        }

        nav h2 {
            color: #60a5fa;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: #60a5fa;
        }


        /* ===== HERO SECTION ===== */

        .hero {
            text-align: center;
            padding: 70px 20px 40px;
        }

        .hero h1 {
            font-size: 45px;
            margin-bottom: 15px;
            color: #111827;
        }

        .hero p {
            font-size: 18px;
            color: #6b7280;
        }


        /* ===== FORM CONTAINER ===== */

        .form-container {
            width: 90%;
            max-width: 500px;

            background: white;

            margin: 20px auto 70px;

            padding: 35px;

            border-radius: 15px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .form-container h2 {
            text-align: center;
            margin-bottom: 25px;
        }


        /* ===== FORM ===== */

        form label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;
        }

        form input {
            width: 100%;

            padding: 13px;

            margin-bottom: 18px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            font-size: 15px;
        }

        form input:focus {
            outline: none;

            border-color: #3b82f6;

            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }


        /* ===== BUTTON ===== */

        button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }


        /* ===== FOOTER ===== */

        footer {
            background: #111827;

            color: white;

            text-align: center;

            padding: 20px;
        }

    </style>
</head>


<body>

    <!-- ===== NAVIGATION BAR ===== -->

    <nav>

        <h2>MyWebsite</h2>

        <div>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>

    </nav>


    <!-- ===== HERO SECTION ===== -->

    <section class="hero">

        <h1>Welcome to My Website</h1>

        <p>Create your account and become part of our community.</p>

    </section>


    <!-- ===== REGISTRATION FORM ===== -->

    <div class="form-container">

        <h2>Create Account</h2>

        <form>

            <!-- First Name -->

            <label for="fname">First Name</label>

            <input
                type="text"
                id="fname"
                name="fname"
                placeholder="Enter your first name"
            >


            <!-- Last Name -->

            <label for="lname">Last Name</label>

            <input
                type="text"
                id="lname"
                name="lname"
                placeholder="Enter your last name"
            >


            <!-- Email -->

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
            >


            <!-- Password -->

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
            >


            <!-- Submit -->

            <button type="submit">
                Create Account
            </button>

        </form>

    </div>


    <!-- ===== FOOTER ===== -->

    <footer>

        <p>© 2026 MyWebsite. All rights reserved.</p>

    </footer>

</body>

</html>
```
